name: probe-faceit
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: FACEIT + Allstar reachability from a GitHub runner
        run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/131 Safari/537.36"
          for u in \
            "https://www.faceit.com/api/users/v1/nicknames/z1Nny" \
            "https://www.faceit.com/api/ranking/v1/globalranking/cs2/EU?limit=3" ; do
            echo "== $u"; curl -s -o /tmp/r.json -w "%{http_code} %{size_download}B\n" -A "$UA" -H "Accept: application/json" "$u"; head -c 200 /tmp/r.json; echo
          done
          ID=$(python3 -c "import json;print(json.load(open('/tmp/r.json'))['payload'][0]['user']['id'])" 2>/dev/null || true)
          echo "first ladder id: $ID"
          if [ -n "$ID" ]; then
            curl -s -o /tmp/c.json -w "clips %{http_code}\n" -A "$UA" "https://www.faceit.com/api/allstar/v1/games/cs2/users/$ID/clips?sort=latest&offset=0&expired=false&limit=3"
            head -c 300 /tmp/c.json; echo
            MP4=$(python3 -c "import json,re;c=json.load(open('/tmp/c.json'))['clips'][0];print(re.sub(r'/thumbs/([0-9a-f]+)_thumb\.jpg$',r'/clips/\1.mp4',c['thumbnail_url']))" 2>/dev/null || true)
            echo "mp4: $MP4"; [ -n "$MP4" ] && curl -s -o /dev/null -w "mp4 %{http_code} %{size_download}B %{time_total}s\n" -A "$UA" "$MP4"
          fi
          ffmpeg -version | head -1 || echo "no ffmpeg"
